version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: origem-vinhos-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: origemvinhos
    ports:
      - "5432:5432"
    volumes:
      - origemvinhos_pgdata:/var/lib/postgresql/data

volumes:
  origemvinhos_pgdata:
    driver: local
