version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: origem-vinhos-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: origemvinhos
    ports:
      - "5432:5432"
    volumes:
      - origemvinhos_pgdata:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    container_name: origem-vinhos-chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - origemvinhos_chromadata:/chroma/chroma

volumes:
  origemvinhos_pgdata:
    driver: local
  origemvinhos_chromadata:
    driver: local

